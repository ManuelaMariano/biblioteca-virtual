<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Usuário - Biblioteca Virtual</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="{{ url_for('inicio') }}">Biblioteca Virtual</a>

        <!-- botão que aparece no celular para abrir o menu -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{{ url_for('inicio') }}">Início</a>
                <a class="nav-link active" href="{{ url_for('usuarios') }}">Usuários</a>
                <a class="nav-link" href="{{ url_for('livros') }}">Livros</a>
                <a class="nav-link" href="{{ url_for('emprestimos') }}">Empréstimos</a>
            </div>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('login') }}">Sair</a>
        </div>

    </div>
</nav>

<div class="container mt-4 mb-4 flex-grow-1">

    <h2 class="mb-4">Editar Usuário</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <!-- method="post": os dados são enviados para a rota, que salva na lista -->
            <form method="post" action="{{ url_for('editar_usuario', id=usuario.id) }}">

            <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                    <label class="form-label">Nome:</label>
                    <input type="text" name="nome" class="form-control" value="{{ usuario.nome }}" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Email:</label>
                    <input type="email" name="email" class="form-control" value="{{ usuario.email }}" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-12 col-sm-6 col-lg-3">
                    <label class="form-label">Celular:</label>
                    <input type="text" name="celular" class="form-control" value="{{ usuario.celular }}" required>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <label class="form-label">Data de Nascimento:</label>
                    <input type="date" name="nascimento" class="form-control" value="{{ usuario.nascimento }}" required>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <label class="form-label">CPF:</label>
                    <input type="text" name="cpf" class="form-control" value="{{ usuario.cpf }}" required>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <label class="form-label">Nível de Acesso:</label>
                    <select name="nivel" class="form-select" required>
                        <option value="">-- ESCOLHA --</option>
                        <option{% if usuario.nivel == 'Usuário' %} selected{% endif %}>Usuário</option>
                        <option{% if usuario.nivel == 'Administrador' %} selected{% endif %}>Administrador</option>
                    </select>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-12 col-md-3">
                    <label class="form-label">CEP:</label>
                    <input type="text" name="cep" class="form-control" value="{{ usuario.cep }}" required>
                </div>
                <div class="col-12 col-md-7">
                    <label class="form-label">Endereço:</label>
                    <input type="text" name="endereco" class="form-control" value="{{ usuario.endereco }}" required>
                </div>
                <div class="col-12 col-md-2">
                    <label class="form-label">Número:</label>
                    <input type="text" name="numero" class="form-control" value="{{ usuario.numero }}" required>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-12 col-md-4">
                    <label class="form-label">Complemento:</label>
                    <input type="text" name="complemento" class="form-control" value="{{ usuario.complemento }}">
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Cidade:</label>
                    <input type="text" name="cidade" class="form-control" value="{{ usuario.cidade }}" required>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Estado:</label>
                    <select name="estado" class="form-select" required>
                        <option value="">-- ESCOLHA --</option>
                        {% for uf in estados %}
                        <option{% if usuario.estado == uf %} selected{% endif %}>{{ uf }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-between botoes-form">
                <a href="{{ url_for('usuarios') }}" class="btn btn-primary">Voltar</a>
                <button type="reset" class="btn btn-secondary">Limpar</button>
                <button type="submit" class="btn btn-success">Salvar</button>
            </div>

            </form>

        </div>
    </div>

</div>

<footer class="bg-dark text-light text-center py-3 mt-auto">
    Biblioteca - Bia e Manu
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
