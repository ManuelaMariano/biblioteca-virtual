<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuários - Biblioteca Virtual</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="{{ url_for('inicio') }}">
            Biblioteca Virtual
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('inicio') }}">Início</a>
            <a class="nav-link active" href="{{ url_for('usuarios') }}">Usuários</a>
            <a class="nav-link" href="{{ url_for('livros') }}">Livros</a>
            <a class="nav-link" href="{{ url_for('emprestimos') }}">Empréstimos</a>
        </div>

    </div>
</nav>


<div class="container mt-5">

    <h2 class="mb-4">Cadastro de Usuários</h2>

    <div class="card">
        <div class="card-body">

            <form>

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Nome:</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email:</label>
                        <input type="email" class="form-control">
                    </div>

                </div>


                <div class="row mb-3">

                    <div class="col-md-3">
                        <label class="form-label">Celular:</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Data de Nascimento:</label>
                        <input type="date" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">CPF:</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Nível de Acesso:</label>

                        <select class="form-select">
                            <option>-- ESCOLHA --</option>
                            <option>Usuário</option>
                            <option>Administrador</option>
                        </select>
                    </div>

                </div>


                <div class="row mb-3">

                    <div class="col-md-3">
                        <label class="form-label">CEP:</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-7">
                        <label class="form-label">Endereço:</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Número:</label>
                        <input type="text" class="form-control">
                    </div>

                </div>


                <div class="row mb-4">

                    <div class="col-md-4">
                        <label class="form-label">Complemento:</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Cidade:</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Estado:</label>

                        <select class="form-select">
                            <option>-- ESCOLHA --</option>
                            <option>SP</option>
                            <option>RJ</option>
                            <option>MG</option>
                            <option>PR</option>
                        </select>
                    </div>

                </div>


                <div class="d-flex justify-content-between">

                    <a href="{{ url_for('usuarios') }}"
                       class="btn btn-primary">
                        Voltar
                    </a>

                    <button type="reset"
                            class="btn btn-secondary">
                        Limpar
                    </button>

                    <button type="button"
                            class="btn btn-success">
                        Salvar
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

</body>

</html>
