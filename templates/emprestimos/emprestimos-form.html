{% extends 'layout/base_menu.html' %}
{% block titulo %}Cadastro de Empréstimos - Biblioteca Virtual{% endblock %}
{% block conteudo %}
<div class="">
  <h2 class="mb-3">Cadastro de Empréstimos</h2>
  <p class="text-muted small">Formulário demonstrativo: o botão Salvar volta à listagem, mas ainda não grava no banco de dados.</p>
  <div class="card border-0 shadow-sm rounded-3"><div class="card-body p-4">
    <form action="{{ url_for('listar_emprestimos') }}" method="GET">
      <div class="row g-3">

        <div class="col-12 col-md-6">
          <label class="form-label" for="usuario">Usuário:</label>
          <select class="form-select" id="usuario" name="usuario" required><option value="">-- ESCOLHA --</option><option>Maria Silva</option><option>João Souza</option></select>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="livro">Livro:</label>
          <select class="form-select" id="livro" name="livro" required><option value="">-- ESCOLHA --</option><option>Dom Casmurro</option><option>O Pequeno Príncipe</option></select>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="inicio">Data do Empréstimo:</label>
          <input class="form-control" id="inicio" name="inicio" type="date" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="devolucao">Devolução Prevista:</label>
          <input class="form-control" id="devolucao" name="devolucao" type="date" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="status">Status:</label>
          <select class="form-select" id="status" name="status" required><option value="">-- ESCOLHA --</option><option>Em andamento</option><option>Devolvido</option></select>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="observacao">Observação:</label>
          <textarea class="form-control" id="observacao" name="observacao" rows="2"></textarea>
        </div>
      </div>
      <div class="d-flex justify-content-between gap-2 mt-4">
        <a href="{{ url_for('listar_emprestimos') }}" class="btn btn-primary">Voltar</a>
        <button type="reset" class="btn btn-secondary">Limpar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Salvar (Demo)</button>
      </div>
    </form>
  </div></div>
</div>
{% endblock %}
