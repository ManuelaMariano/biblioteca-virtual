{% extends 'layout/base_menu.html' %}

{% block titulo_aba %}Cadastrar Livro — Biblioteca Virtual{% endblock %}

{% block conteudo %}
<h1 class="h2 mb-2">Cadastrar Livro</h1>
<p class="text-body-secondary">Formulário demonstrativo. A gravação no banco fica para o CRUD da próxima etapa.</p>

<div class="card">
  <div class="card-body">
    <form action="{{ url_for('listar_livros') }}" method="get">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="titulo" class="form-label">Título</label>
          <input class="form-control" id="titulo" name="titulo" type="text" required>
        </div>
        <div class="col-md-6">
          <label for="autor" class="form-label">Autor</label>
          <input class="form-control" id="autor" name="autor" type="text" required>
        </div>
        <div class="col-md-6">
          <label for="categoria" class="form-label">Categoria</label>
          <input class="form-control" id="categoria" name="categoria" type="text">
        </div>
        <div class="col-md-3">
          <label for="ano" class="form-label">Ano de Publicação</label>
          <input class="form-control" id="ano" name="ano" type="number">
        </div>
        <div class="col-md-3">
          <label for="quantidade" class="form-label">Quantidade</label>
          <input class="form-control" id="quantidade" name="quantidade" type="number" min="0" required>
        </div>
        <div class="col-md-6">
          <label for="isbn" class="form-label">ISBN</label>
          <input class="form-control" id="isbn" name="isbn" type="text">
        </div>
        <div class="col-md-6">
          <label for="editora" class="form-label">Editora</label>
          <input class="form-control" id="editora" name="editora" type="text">
        </div>
      </div>

      <div class="d-flex justify-content-between gap-2 mt-4">
        <a href="{{ url_for('listar_livros') }}" class="btn btn-outline-secondary">Voltar</a>
        <button type="reset" class="btn btn-secondary">Limpar</button>
        <button type="submit" class="btn btn-primary">Salvar (Demo)</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
