{% extends 'layout/base_menu.html' %}
{% block titulo %}Cadastro de Livros - Biblioteca Virtual{% endblock %}
{% block conteudo %}
<div class="">
  <h2 class="mb-3">Cadastro de Livros</h2>
  <p class="text-muted small">Formulário demonstrativo: o botão Salvar volta à listagem, mas ainda não grava no banco de dados.</p>
  <div class="card border-0 shadow-sm rounded-3"><div class="card-body p-4">
    <form action="{{ url_for('listar_livros') }}" method="GET">
      <div class="row g-3">

        <div class="col-12 col-md-6">
          <label class="form-label" for="titulo">Título:</label>
          <input class="form-control" id="titulo" name="titulo" type="text" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="autor">Autor:</label>
          <input class="form-control" id="autor" name="autor" type="text" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="categoria">Categoria:</label>
          <input class="form-control" id="categoria" name="categoria" type="text" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="ano">Ano de Publicação:</label>
          <input class="form-control" id="ano" name="ano" type="number" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="quantidade">Quantidade:</label>
          <input class="form-control" id="quantidade" name="quantidade" type="number" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="isbn">ISBN:</label>
          <input class="form-control" id="isbn" name="isbn" type="text" >
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="editora">Editora:</label>
          <input class="form-control" id="editora" name="editora" type="text" >
        </div>
      </div>
      <div class="d-flex justify-content-between gap-2 mt-4">
        <a href="{{ url_for('listar_livros') }}" class="btn btn-primary">Voltar</a>
        <button type="reset" class="btn btn-secondary">Limpar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Salvar (Demo)</button>
      </div>
    </form>
  </div></div>
</div>
{% endblock %}
