{% extends 'layout/base_menu.html' %}
{% block titulo %}Cadastro de Livros - Biblioteca Virtual{% endblock %}
{% block conteudo %}
<div class="container mt-4 mb-4 flex-grow-1">

    <h2 class="mb-4">Cadastro de Livros</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="post" action="{{ url_for('inserir_livros') }}">

            <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                    <label class="form-label">Título:</label>
                    <input type="text" name="titulo" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Autor:</label>
                    <input type="text" name="autor" class="form-control" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-12 col-md-4">
                    <label class="form-label">Categoria:</label>
                    <input type="text" name="categoria" class="form-control" required>
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <label class="form-label">Ano de Publicação:</label>
                    <input type="number" name="ano" class="form-control" required>
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <label class="form-label">Quantidade:</label>
                    <input type="number" name="quantidade" class="form-control" required>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                    <label class="form-label">ISBN:</label>
                    <input type="text" name="isbn" class="form-control">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Editora:</label>
                    <input type="text" name="editora" class="form-control">
                </div>
            </div>

            <div class="d-flex justify-content-between botoes-form">
                <a href="{{ url_for('listar_livros') }}" class="btn btn-primary">Voltar</a>
                <button type="reset" class="btn btn-secondary">Limpar</button>
                <button type="submit" class="btn btn-success">Salvar</button>
            </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
