{% extends 'layout/base_menu.html' %}
{% block titulo %}Cadastro de Usuários - Biblioteca Virtual{% endblock %}
{% block conteudo %}
<div class="container mt-4 mb-4 flex-grow-1">

    <h2 class="mb-4">Cadastro de Usuários</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="post" action="{{ url_for('cadastrar_usuario') }}">

            <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                    <label class="form-label">Nome:</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Email:</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-12 col-sm-6 col-lg-3">
                    <label class="form-label">Celular:</label>
                    <input type="text" name="celular" class="form-control" required>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <label class="form-label">Data de Nascimento:</label>
                    <input type="date" name="nascimento" class="form-control" required>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <label class="form-label">CPF:</label>
                    <input type="text" name="cpf" class="form-control" required>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <label class="form-label">Nível de Acesso:</label>
                    <select name="nivel" class="form-select" required>
                        <option value="">-- ESCOLHA --</option>
                        <option>Usuário</option>
                        <option>Administrador</option>
                    </select>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-12 col-md-3">
                    <label class="form-label">CEP:</label>
                    <input type="text" name="cep" class="form-control" required>
                </div>
                <div class="col-12 col-md-7">
                    <label class="form-label">Endereço:</label>
                    <input type="text" name="endereco" class="form-control" required>
                </div>
                <div class="col-12 col-md-2">
                    <label class="form-label">Número:</label>
                    <input type="text" name="numero" class="form-control" required>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-12 col-md-4">
                    <label class="form-label">Complemento:</label>
                    <input type="text" name="complemento" class="form-control">
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Cidade:</label>
                    <input type="text" name="cidade" class="form-control" required>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Estado:</label>
                    <select name="estado" class="form-select" required>
                        <option value="">-- ESCOLHA --</option>
                        {% for uf in estados %}
                        <option>{{ uf }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-between botoes-form">
                <a href="{{ url_for('usuarios') }}" class="btn btn-primary">Voltar</a>
                <button type="reset" class="btn btn-secondary">Limpar</button>
                <button type="submit" class="btn btn-success">Salvar</button>
            </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
