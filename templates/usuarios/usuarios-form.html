{% extends 'layout/base_menu.html' %}
{% block titulo %}Cadastro de Usuários - Biblioteca Virtual{% endblock %}
{% block conteudo %}
<div class="">
  <h2 class="mb-3">Cadastro de Usuários</h2>
  <p class="text-muted small">Formulário demonstrativo: o botão Salvar volta à listagem, mas ainda não grava no banco de dados.</p>
  <div class="card border-0 shadow-sm rounded-3"><div class="card-body p-4">
    <form action="{{ url_for('listar_usuarios') }}" method="GET">
      <div class="row g-3">

        <div class="col-12 col-md-6">
          <label class="form-label" for="nome">Nome:</label>
          <input class="form-control" id="nome" name="nome" type="text" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="email">E-mail:</label>
          <input class="form-control" id="email" name="email" type="email" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="celular">Celular:</label>
          <input class="form-control" id="celular" name="celular" type="tel" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="nascimento">Data de Nascimento:</label>
          <input class="form-control" id="nascimento" name="nascimento" type="date" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="cpf">CPF:</label>
          <input class="form-control" id="cpf" name="cpf" type="text" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="nivel">Nível de Acesso:</label>
          <select class="form-select" id="nivel" name="nivel" required><option value="">-- ESCOLHA --</option><option>Usuário</option><option>Administrador</option></select>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="cep">CEP:</label>
          <input class="form-control" id="cep" name="cep" type="text" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="endereco">Endereço:</label>
          <input class="form-control" id="endereco" name="endereco" type="text" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="numero">Número:</label>
          <input class="form-control" id="numero" name="numero" type="text" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="complemento">Complemento:</label>
          <input class="form-control" id="complemento" name="complemento" type="text" >
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="cidade">Cidade:</label>
          <input class="form-control" id="cidade" name="cidade" type="text" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="estado">Estado:</label>
          <select class="form-select" id="estado" name="estado" required><option value="">-- ESCOLHA --</option><option>SP</option><option>RJ</option><option>MG</option><option>PR</option><option>SC</option><option>RS</option><option>BA</option><option>DF</option><option>GO</option><option>Outro</option></select>
        </div>
      </div>
      <div class="d-flex justify-content-between gap-2 mt-4">
        <a href="{{ url_for('listar_usuarios') }}" class="btn btn-primary">Voltar</a>
        <button type="reset" class="btn btn-secondary">Limpar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Salvar (Demo)</button>
      </div>
    </form>
  </div></div>
</div>
{% endblock %}
